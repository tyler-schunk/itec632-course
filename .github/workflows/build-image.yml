# Builds the course image for Intel/AMD and Apple Silicon and publishes it to
# GitHub Container Registry as ghcr.io/<owner>/itec632-course:<tag>.
#
# To release a new image: push a tag like  image-2027.1  (or run it manually
# from the Actions tab and type the tag). After the first run, open the package's
# settings on GitHub and set its visibility to Public so students can pull it.
name: build-course-image

on:
  push:
    tags: ["image-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. 2027.1"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME#image-}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner (GHCR requires it)
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/itec632-course:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.owner.outputs.owner }}/itec632-course:latest
